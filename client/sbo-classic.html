<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scoreboard Operator (Classic) - Boards</title>
<link rel="stylesheet" href="sbo.css">
<script type="module" src="sbo.js"></script>
</head>
<body>

<div id="sbo-classic">
<div id="tabs">
	<button id="_controls">Controls</button>
	<button id="teams">Teams</button>
	<button id="rules">Rules</button>
	<button id="igrf">IGRF</button>
	<button id="settings">Settings</button>
	<button id="logout">Logout</button>
</div>
<div id="controls">
	<button id="edit-key-control">Edit Key Control</button>
	<button id="auto-end-jams">Auto End Jams</button>
	<button id="replace-on-undo">Enable Replace on Undo</button>
	<button id="score-adjustments">Use Score Adjustments</button>
	<button id="tab-bar">Show Tab Bar</button>
	<button id="new-game">Start New Game</button>
	<button id="end-of-period">End of Period Controls</button>
</div>
<div id="timing">
	<button fn="start_jam">Start Jam</button>
	<button fn="end_jam">Lineup</button>
	<button fn="timeout">Timeout</button>
	<button fn="undo">---</button>
</div>

<div id="main-panel">
<div team="0">
	<span class="logo">Logo</span>
	<span class="name">Name</span>
	<br>
	<button fn="set_trip_points" value="inc">Trip Pts -1</button>
	<span class="jam-points">Jam Pts: <span class="points">0</span></span>
	<span class="game-points">0</span>
	<button fn="set_trip_points" value="dec">Trip Pts +1</button>
	<br>
	<button id="remove-trip-1">Remove Trip</button>
	<span class="trip-points">Trip Pts: <output class="points">0</output></span>
	<button id="add-trip-1">Add Trip</button>
	<br>
	<span id="set-points">Set Trip Pts</span>
	<button fn="set_trip_points" value="0">0</button>
	<button fn="set_trip_points" value="1">1</button>
	<button fn="set_trip_points" value="2">2</button>
	<button fn="set_trip_points" value="3">3</button>
	<button fn="set_trip_points" value="4">4</button>
	<br>
	<button id="team-to-1">Team<br>TO</button>
	<span id="to-remaining-1">3</span>
	<button id="team-or-1">Off<br>Review</button>
	<span id="or-remaining-1">1</span>
	<button id="retained-1">Retained</button>
	<br>
	<button id="star-pass-1">Star Pass</button>
	<span class="toggles">
	<button fn="toggle">No Pivot</button>
	<button fn="toggle">Lost</button>
	<button fn="toggle">Lead</button>
	<button fn="toggle">Call</button>
	<button fn="toggle">Inj</button>
	<button fn="toggle" pressed>NI</button>
	</span>
	<br>
	<span id="jammer-1">Jammer:</span>
	<span id="jammer-sel-1">
		<template><button>?</button></template>
	</span>
	<button id="jammer-box-1">Box</button>
	<br>
	<span id="pivot-1">Piv/4th Bl:</span>
	<span id="pivot-sel-1">
		<template><button>?</button></template>
	</span>
	<button id="pivot-box-1">Box</button>
</div>
<button fn="timeout" value="OTO">Official Timeout</button>
<div team="1">
	<span class="name">Name</span>
	<span class="logo">Logo</span>
	<br>
	<button fn="set_trip_points" value="inc">Trip Pts +1</button>
	<span class="jam-points">Jam Pts: <span class="points">0</span></span>
	<span class="game-points">0</span>
	<button fn="set_trip_points" value="dec">Trip Pts -1</button>
	<br>
	<button id="add-trip-2">Add Trip</button>
	<span class="trip-points">Trip Pts: <output class="points">0</output></span>
	<button id="remove-trip-2">Remove Trip</button>
	<br>
	<button id="set-points-2-4" class="trip-points">4</button>
	<button id="set-points-2-3" class="trip-points">3</button>
	<button id="set-points-2-2" class="trip-points">2</button>
	<button id="set-points-2-1" class="trip-points">1</button>
	<button id="set-points-2-0" class="trip-points">0</button>
	<span id="set-points">Set Trip Pts</span>
	<br>
	<button id="retained-2">Retained</button>
	<span id="or-remaining-2">1</span>
	<button id="team-or-2">Off<br>Review</button>
	<span id="to-remaining-2">3</span>
	<button id="team-to-2">Team<br>TO</button>
	<br>
	<span class="toggles">
	<button fn="toggle">Lost</button>
	<button fn="toggle">Lead</button>
	<button fn="toggle">Call</button>
	<button fn="toggle">Inj</button>
	<button fn="toggle" pressed>NI</button>
	</span>
	<button id="star-pass-2">Star Pass</button>
	<button fn="toggle">No Pivot</button>
	<br>
	<span id="jammer-2">Jammer:</span>
	<span id="jammer-sel-2">
		<template><button>?</button></template>
	</span>
	<button id="jammer-box-2">Box</button>
	<br>
	<span id="pivot-2">Piv/4th Bl:</span>
	<span id="pivot-sel-2">
		<template><button>?</button></template>
	</span>
	<button id="pivot-box-2">Box</button>
</div>
</div>

<div id="clocks">
	<div clock="period">
	<span class="name">Period</span>
	<output class="count">1</output>
	<span class="time">
	<button id="period-minus">-1</button>
	<output class="time">30:00</output>
	<button id="period-plus">+1</button>
	</span>
	</div>

	<div clock="jam">
	<span class="name">Jam</span>
	<output class="count">1</output>
	<span class="time">
	<button id="jam-minus">-1</button>
	<output>2:00</output>
	<button id="jam-plus">+1</button>
	</span>
	</div>

	<div clock="lineup">
	<span class="name">Lineup</span>
	<output class="count">1</output>
	<span class="time">
	<button id="lineup-minus">-1</button>
	<output>0:00</output>
	<button id="lineup-plus">+1</button>
	</span>
	</div>

	<div clock="timeout">
	<span class="name">Timeout</span>
	<output class="count">1</output>
	<span class="time">
	<button id="timeout-minus">-1</button>
	<output>30:00</output>
	<button id="timeout-plus">+1</button>
	</span>
	</div>

	<div clock="intermission">
	<span class="name">Intermission</span>
	<output class="count">1</output>
	<span class="time">
	<button id="period-minus">-1</button>
	<output>30:00</output>
	<button id="period-plus">+1</button>
	</span>
	</div>
</div>

<div id="sk-sheets">
<iframe src="score.html?team=0" team="0" onload="this.style.height=(this.contentWindow.document.body.scrollHeight+20)+'px';"></iframe>
<iframe src="score.html?team=1" team="1" onload="this.style.height=(this.contentWindow.document.body.scrollHeight+20)+'px';">></iframe>
</div>

</body>
</html>
