<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scoreboard Operator (Classic) - Boards</title>
<link rel="stylesheet" href="sbo.css">
</head>
<body>

<div id="sbo-classic">
<div id="tabs">
	<button id="controls">Controls</button>
	<button id="teams">Teams</button>
	<button id="rules">Rules</button>
	<button id="igrf">IGRF</button>
	<button id="settings">Settings</button>
	<button id="logout">Logout</button>
</div>
<div id="controls">
	<button id="edit-key-control">Edit Key Control</button>
	<button id="auto-end-jams">Auto End Jams</button>
	<button id="replace-on-undo">Enable Replace on Undo</button>
	<button id="score-adjustments">Use Score Adjustments</button>
	<button id="tab-bar">Show Tab Bar</button>
	<button id="new-game">Start New Game</button>
	<button id="end-of-period">End of Period Controls</button>
</div>
<div id="timing">
	<button id="start-jam">Start Jam</button>
	<button id="lineup">Lineup</button>
	<button id="timeout">Timeout</button>
	<button id="undo">---</button>
</div>
<div id="team-1">
	<span class="logo"></span>
	<span class="name"></span>
	<br>
	<button id="points-1-minus">Trip Pts -1</button>
	<span class="jam-points">Jam Pts: <span class="points">0</span></span>
	<span class="game-points">0</span>
	<button id="points-1-plus">Trip Pts +1</button>
	<br>
	<button id="remove-trip-1">Remove Trip</button>
	<span class="trip-points">Trip Pts: <span class="points">0</span></span>
	<button id="add-trip-1">Add Trip</button>
	<br>
	<span id="set-points">Set Trip Pts</span>
	<button id="set-points-1-0">0</button>
	<button id="set-points-1-1">1</button>
	<button id="set-points-1-2">2</button>
	<button id="set-points-1-3">3</button>
	<button id="set-points-1-4">4</button>
	<br>
	<button id="team-to-1">Team<br>TO</button>
	<span id="to-remaining-1">3</span>
	<button id="team-or-1">Off<br>Review</button>
	<span id="or-remaining-1">1</span>
	<button id="retained-1">Retained</button>
	<br>
	<button id="star-pass-1">Star Pass</button>
	<button id="no-pivot-1">No Pivot</button>
	<button id="lost-1">Lost</button>
	<button id="lead-1">Lead</button>
	<button id="call-1">Call</button>
	<button id="inj-1">Inj</button>
	<button id="ni-1">NI</button>
	<br>
	<span id="jammer-1">Jammer:</span>
	<span id="jammer-sel-1">
		<template><button>?</button></template>
	</span>
	<button id="jammer-box-1">Box</button>
	<br>
	<span id="pivot-1">Piv/4th Bl:</span>
	<span id="pivot-sel-1">
		<template><button>?</button></template>
	</span>
	<button id="pivot-box-1">Box</button>
</div>
<div id="team-2">
	<span class="name"></span>
	<span class="logo"></span>
	<br>
	<button id="points-2-plus">Trip Pts +1</button>
	<span class="jam-points">Jam Pts: <span class="points">0</span></span>
	<span class="game-points">0</span>
	<button id="points-2-minus">Trip Pts -1</button>
	<br>
	<button id="add-trip-2">Add Trip</button>
	<span class="trip-points">Trip Pts: <span class="points">0</span></span>
	<button id="remove-trip-2">Remove Trip</button>
	<br>
	<button id="set-points-2-4">4</button>
	<button id="set-points-2-3">3</button>
	<button id="set-points-2-2">2</button>
	<button id="set-points-2-1">1</button>
	<button id="set-points-2-0">0</button>
	<span id="set-points">Set Trip Pts</span>
	<br>
	<button id="retained-2">Retained</button>
	<span id="or-remaining-2">1</span>
	<button id="team-or-2">Off<br>Review</button>
	<span id="to-remaining-2">3</span>
	<button id="team-to-2">Team<br>TO</button>
	<br>
	<button id="lost-2">Lost</button>
	<button id="lead-2">Lead</button>
	<button id="call-2">Call</button>
	<button id="inj-2">Inj</button>
	<button id="ni-2">NI</button>
	<button id="star-pass-2">Star Pass</button>
	<button id="no-pivot-2">No Pivot</button>
	<br>
	<span id="jammer-2">Jammer:</span>
	<span id="jammer-sel-2">
		<template><button>?</button></template>
	</span>
	<button id="jammer-box-2">Box</button>
	<br>
	<span id="pivot-2">Piv/4th Bl:</span>
	<span id="pivot-sel-2">
		<template><button>?</button></template>
	</span>
	<button id="pivot-box-2">Box</button>
</div>

<div class="clock" id="period">
<span class="name">Period</span>
<span class="jam">1</span>
<button id="period-minus">-1</button>
<span class="time">30:00</span>
<button id="period-plus">+1</button>
</div>

<div class="clock" id="jam">
<span class="name">Jam</span>
<span class="jam">1</span>
<button id="jam-minus">-1</button>
<span class="time">2:00</span>
<button id="jam-plus">+1</button>
</div>

<div class="clock" id="lineup">
<span class="name">Lineup</span>
<span class="jam">1</span>
<button id="lineup-minus">-1</button>
<span class="time">0:00</span>
<button id="lineup-plus">+1</button>
</div>

<div class="clock" id="timeout">
<span class="name">Timeout</span>
<span class="jam">1</span>
<button id="timeout-minus">-1</button>
<span class="time">30:00</span>
<button id="timeout-plus">+1</button>
</div>

<div class="clock" id="intermission">
<span class="name">Intermission</span>
<span class="jam">1</span>
<button id="period-minus">-1</button>
<span class="time">30:00</span>
<button id="period-plus">+1</button>
</div>

</div>

<div id="sk-sheets">
<iframe src="score.html?team=1"></iframe>
<iframe src="score.html?team=2"></iframe>
</div>

</body>
</html>
