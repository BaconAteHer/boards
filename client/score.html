<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scorekeeper - Boards</title>
<link rel="stylesheet" href="score.css">
<script type="module" src="score.js"></script>
</head>
<body>

<div id="nav"></div>

<div id="sk">
<br>
<div class="metadata">
<span class="team-name" id="sk-team">Team</span>
<span class="team-color" id="sk-color">Color</span>
<span class="game-date" id="sk-date">Date</span>
<span class="nso-sk" id="sk-keeper">Scorekeeper</span>
<span class="so-jr" id="sk-jammer-ref">Jammer Ref</span>
<span class="period-number" id="sk-period">1</span>
</div>
<table>
<thead><tr class="header">
	<th>JAM</th>
	<th>Jammer's Number</th>
	<th class="rot">LOST</th>
	<th class="rot">LEAD</th>
	<th class="rot">CALL</th>
	<th class="rot">INJ.</th>
	<th class="rot">NI</th>
	<th>Trip 2</th>
	<th>Trip 3</th>
	<th>Trip 4</th>
	<th>Trip 5</th>
	<th>Trip 6</th>
	<th>Trip 7</th>
	<th>Trip 8</th>
	<th>Trip 9</th>
	<th>Trip 10</th>
	<th>Jam Total</th>
	<th>Game Total</th>
</tr></thead>
<tbody>
	<template><tr>
	<td class="jam"><output></input></td>
	<td class="jammer"><input list="jammers"></input></td>
	<td class="lost"><input type="checkbox" tabindex="-1"></input></td>
	<td class="lead"><input type="checkbox" tabindex="-1"></input></td>
	<td class="call"><input type="checkbox" tabindex="-1"></input></td>
	<td class="inj"><input type="checkbox" tabindex="-1"></input></td>
	<td class="ni"><input type="checkbox"></input></td>
	<td class="trip"><input></input></td>
	<td class="trip"><input></input></td>
	<td class="trip"><input></input></td>
	<td class="trip"><input></input></td>
	<td class="trip"><input></input></td>
	<td class="trip"><input></input></td>
	<td class="trip"><input></input></td>
	<td class="trip"><input></input></td>
	<td class="trip"><input></input></td>
	<td class="jam-total"><output></output></td>
	<td class="game-total"><output></output></td>
	</tr></template>
</tbody>
<tfoot><tr class="footer">
	<td></td>
	<td>PERIOD TOTALS</td>
	<td class="rot"></td>
	<td class="rot"></td>
	<td class="rot"></td>
	<td class="rot"></td>
	<td class="rot"></td>
	<td></td>
	<td></td>
	<td></td>
	<td></td>
	<td></td>
	<td></td>
	<td></td>
	<td></td>
	<td></td>
	<td></td>
	<td></td>
</tr></tfoot>
</table>
<div class="controls">
	<button fn="star_pass">Star Pass</button>
	<button fn="next_jam">Next Jam</button>
</div>
<datalist id="jammers">
	<option value="5309">5309</option>
	<option value="867">867</option>
	<option value="9000">9000</option>
</datalist>
</div>

<script>
if (window.parent !== window) {
    document.documentElement.classList.add('inside-iframe');
}
</script>

</body>
</html>
